<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>PitWall</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0e1014; --panel:#161920; --line:#262a33; --text:#e6e6e6; --dim:#8a8f98; --ok:#51cf66; --bad:#ff6b6b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px system-ui,sans-serif; }
  header { display:flex; gap:18px; align-items:baseline; padding:12px 20px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:20px; letter-spacing:.5px; }
  header span { color:var(--dim); } #conn.ok { color:var(--ok); } #conn.bad { color:var(--bad); } #clock { color:var(--text); font-variant-numeric:tabular-nums; }
  main { display:grid; grid-template-columns:minmax(300px,1.1fr) minmax(360px,1fr); gap:14px; padding:14px 20px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; min-width:0; }
  .wide { grid-column:1 / -1; }
  #map { width:100%; height:430px; display:block; }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th { text-align:left; color:var(--dim); font-weight:500; padding:4px 6px; font-size:12px; }
  td { padding:3px 6px; border-top:1px solid var(--line); white-space:nowrap; }
  tr.row { cursor:pointer; } tr.row:hover { background:#1d212a; } tr.sel { background:#222836; }
  .bar { display:inline-block; width:4px; height:14px; border-radius:2px; margin-right:6px; vertical-align:middle; }
  .stats { display:flex; gap:26px; flex-wrap:wrap; margin:6px 0 10px; }
  .stat .v { font-size:24px; font-weight:600; font-variant-numeric:tabular-nums; } .stat .l { color:var(--dim); font-size:12px; }
  #trace { width:100%; height:170px; display:block; }
  .prow { display:flex; align-items:center; gap:8px; margin:3px 0; }
  .prow .n { width:44px; } .prow .p { width:56px; text-align:right; color:var(--dim); font-variant-numeric:tabular-nums; }
  .prow .b { height:12px; border-radius:3px; }
  .legend { color:var(--dim); font-size:12px; margin-top:4px; }
  @media (max-width:800px) { main { grid-template-columns:1fr; } }
</style></head><body>
<header>
  <h1>PitWall</h1><span id="clock">Race clock 00:00</span><span id="lapno"></span>
  <span id="rate"></span><span id="conn" class="bad">connecting...</span>
</header>
<main>
  <section class="panel"><canvas id="map"></canvas></section>
  <section class="panel">
    <table id="board"><thead><tr><th>P</th><th>Driver</th><th>Gap</th><th>Interval</th><th>Last lap</th><th>Tyre</th></tr></thead><tbody></tbody></table>
  </section>
  <section class="panel wide">
    <div id="who" style="font-weight:600">Click a driver</div>
    <div class="stats">
      <div class="stat"><div class="v" id="v-speed">-</div><div class="l">km/h</div></div>
      <div class="stat"><div class="v" id="v-gear">-</div><div class="l">gear</div></div>
      <div class="stat"><div class="v" id="v-thr">-</div><div class="l">throttle %</div></div>
      <div class="stat"><div class="v" id="v-brk">-</div><div class="l">brake</div></div>
      <div class="stat"><div class="v" id="v-rpm">-</div><div class="l">rpm</div></div>
    </div>
    <canvas id="trace"></canvas>
    <div class="legend">Last 60 race seconds: speed (white), throttle (green), braking (red bands)</div>
  </section>
  <section class="panel wide">
    <div style="font-weight:600">Win probability <span id="predlap" style="color:var(--dim);font-weight:400"></span></div>
    <div id="pred"></div>
  </section>
</main>
<script>
const S = { drivers:{}, cars:{}, pos:{}, gaps:{}, lastLap:{}, tyre:{}, lap:0, raceT:0, selected:null ,pred:null};
const track = [];                       // x,y points of one car, draws the circuit outline
let refDriver = null, trace = [], bounds = null, msgs = 0, evs = 0;

const $ = id => document.getElementById(id);
const mapCv = $("map"), traceCv = $("trace");
const TYRE = { SOFT:"#ff6b6b", MEDIUM:"#fcc419", HARD:"#e6e6e6", INTERMEDIATE:"#51cf66", WET:"#4dabf7" };

function fitCanvas(cv) {
  const r = devicePixelRatio || 1;
  cv.width = Math.max(1, cv.clientWidth * r); cv.height = Math.max(1, cv.clientHeight * r);
}
function growBounds(x, y) {
  if (x == null || y == null) return;
  if (!bounds) bounds = { x0:x, x1:x, y0:y, y1:y };
  bounds.x0 = Math.min(bounds.x0, x); bounds.x1 = Math.max(bounds.x1, x);
  bounds.y0 = Math.min(bounds.y0, y); bounds.y1 = Math.max(bounds.y1, y);
}
function fmtLap(s) { if (s == null) return "-"; const m = Math.floor(s / 60); return m + ":" + (s - m * 60).toFixed(3).padStart(6, "0"); }
function fmtGap(g) { return g == null ? "-" : (typeof g === "number" ? "+" + g.toFixed(3) : g); }
function colour(d) { return (S.drivers[d] && S.drivers[d].colour) || "#888"; }

function noteLap(e) {
  S.lastLap[e.driver] = e.lap_duration;
  S.tyre[e.driver] = { c: e.compound, age: e.tyre_age };
  S.lap = Math.max(S.lap, e.lap_number || 0);
}
function pushTrace(e) {
  trace.push({ t: S.raceT, v: e.speed, th: e.throttle, br: e.brake });
  while (trace.length && trace[0].t < S.raceT - 70) trace.shift();
}
function apply(e) {
  if (e.type === "car") {
    S.cars[e.driver] = e; growBounds(e.x, e.y);
    if (!refDriver) refDriver = e.driver;
    if (e.driver === refDriver && e.x != null && track.length < 4000) track.push([e.x, e.y]);
    if (e.driver === S.selected) pushTrace(e);
  } else if (e.type === "position") S.pos[e.driver] = e.position;
  else if (e.type === "gap") S.gaps[e.driver] = { g: e.gap_to_leader, i: e.interval };
  else if (e.type === "prediction") S.pred = e;
  else if (e.type === "lap") noteLap(e);
}
function onSnapshot(m) {
  Object.assign(S, { drivers:m.drivers, cars:m.cars, pos:m.positions, raceT:m.race_t, lastLap:{}, tyre:{}, lap:0 });
  S.gaps = {}; for (const d in m.gaps) S.gaps[d] = { g: m.gaps[d].gap_to_leader, i: m.gaps[d].interval };
  m.laps.forEach(noteLap);
  bounds = null; track.length = 0; trace = []; refDriver = null;
  for (const d in S.cars) growBounds(S.cars[d].x, S.cars[d].y);
  if (S.selected && !S.drivers[S.selected]) S.selected = null;   // keep the pick across restarts
  S.pred = m.prediction;
}
function onBatch(m) {
  S.raceT = m.race_t; msgs++; evs += m.events.length;
  m.events.forEach(apply);
}

function ensureSelected() {
  if (S.selected && S.cars[S.selected]) return;
  S.selected = Object.keys(S.pos).sort((a, b) => S.pos[a] - S.pos[b])[0]
            || Object.keys(S.cars)[0] || null;
}

function drawMap() {
  const cv = mapCv, g = cv.getContext("2d"); g.clearRect(0, 0, cv.width, cv.height);
  if (!bounds) return;
  const pad = 30 * (devicePixelRatio || 1);
  const sx = (cv.width - 2 * pad) / Math.max(1, bounds.x1 - bounds.x0);
  const sy = (cv.height - 2 * pad) / Math.max(1, bounds.y1 - bounds.y0);
  const k = Math.min(sx, sy);
  const ox = (cv.width - (bounds.x1 - bounds.x0) * k) / 2, oy = (cv.height - (bounds.y1 - bounds.y0) * k) / 2;
  const X = x => ox + (x - bounds.x0) * k, Y = y => cv.height - oy - (y - bounds.y0) * k;
  g.strokeStyle = "#2c313c"; g.lineWidth = 8 * (devicePixelRatio || 1); g.lineJoin = "round"; g.beginPath();
  track.forEach((p, i) => i ? g.lineTo(X(p[0]), Y(p[1])) : g.moveTo(X(p[0]), Y(p[1]))); g.stroke();
  g.font = (11 * (devicePixelRatio || 1)) + "px system-ui";
  for (const d in S.cars) {
    const c = S.cars[d]; if (c.x == null) continue;
    const sel = d === S.selected, r = (sel ? 8 : 5.5) * (devicePixelRatio || 1);
    g.fillStyle = colour(d); g.beginPath(); g.arc(X(c.x), Y(c.y), r, 0, 6.2832); g.fill();
    if (sel) { g.strokeStyle = "#fff"; g.lineWidth = 2; g.stroke(); }
    g.fillStyle = "#e6e6e6"; g.fillText(d, X(c.x) + r + 3, Y(c.y) + 4);
  }
}
function drawTrace() {
  const cv = traceCv, g = cv.getContext("2d"); g.clearRect(0, 0, cv.width, cv.height);
  if (trace.length < 2) return;
  const t0 = S.raceT - 60, W = cv.width, H = cv.height, tx = t => (t - t0) / 60 * W;
  g.fillStyle = "rgba(255,107,107,.25)";
  trace.forEach((p, i) => { if (p.br && i) g.fillRect(tx(trace[i - 1].t), 0, Math.max(2, tx(p.t) - tx(trace[i - 1].t)), H); });
  const line = (key, max, col, w) => {
    g.strokeStyle = col; g.lineWidth = w * (devicePixelRatio || 1); g.beginPath();
    trace.forEach((p, i) => { const x = tx(p.t), y = H - 4 - (p[key] / max) * (H - 8); i ? g.lineTo(x, y) : g.moveTo(x, y); });
    g.stroke();
  };
  line("th", 100, "#51cf66", 1); line("v", 360, "#e6e6e6", 1.6);
}
function renderBoard() {
  const order = Object.keys(S.cars).sort((a, b) => (S.pos[a] ?? 99) - (S.pos[b] ?? 99));
  $("board").tBodies[0].innerHTML = order.map(d => {
    const g = S.gaps[d] || {}, t = S.tyre[d], p = S.pos[d];
    const tyre = t && t.c ? `<span style="color:${TYRE[t.c] || "#aaa"}">${t.c[0]}</span> ${t.age ?? ""}` : "-";
    return `<tr class="row ${d === S.selected ? "sel" : ""}" data-d="${d}"><td>${p ?? "-"}</td>` +
      `<td><span class="bar" style="background:${colour(d)}"></span>${d}</td>` +
      `<td>${p === 1 ? "Leader" : fmtGap(g.g)}</td><td>${p === 1 ? "-" : fmtGap(g.i)}</td>` +
      `<td>${fmtLap(S.lastLap[d])}</td><td>${tyre}</td></tr>`;
  }).join("");
}
function renderDetail() {
  const c = S.cars[S.selected];
  $("who").textContent = c ? `${S.selected}  ${S.drivers[S.selected]?.name ?? ""}  ${S.drivers[S.selected]?.team ?? ""}` : "Click a driver";
  if (!c) return;
  $("v-speed").textContent = c.speed; $("v-gear").textContent = c.gear; $("v-thr").textContent = c.throttle;
  $("v-brk").textContent = c.brake ? "ON" : "off"; $("v-rpm").textContent = c.rpm;
}
function renderHeader() {
  const m = Math.floor(S.raceT / 60), s = Math.floor(S.raceT % 60);
  $("clock").textContent = `Race clock ${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
  $("lapno").textContent = S.lap ? `Lap ${S.lap}` : "";
}
function renderPred() {
    const p = S.pred;
    if (!p) { $("pred").innerHTML = '<span class="legend">waiting for the first lap...</span>';   $("predlap").textContent = `after lap ${p.lap} (${p.source})`; return; }
    $("predlap").textContent = `after lap ${p.lap}`;
    $("pred").innerHTML = Object.entries(p.probs).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([d, v]) =>
      `<div class="prow"><span class="n">${d}</span><div style="flex:1"><div class="b" style="width:${(v * 100).toFixed(1)}%;background:${colour(d)}"></div></div>` +
      `<span class="p">${(v * 100).toFixed(1)}%</span></div>`).join("");
  }

$("board").addEventListener("click", ev => {
  const row = ev.target.closest("tr.row"); if (!row) return;
  S.selected = row.dataset.d; trace = []; renderBoard(); renderDetail();
});
function frame() { drawMap(); drawTrace(); requestAnimationFrame(frame); }
setInterval(() => { ensureSelected(); renderBoard(); renderDetail(); renderHeader(); renderPred(); }, 250);
setInterval(() => { $("rate").textContent = `${msgs} msg/s, ${evs} events/s`; msgs = evs = 0; }, 1000);
addEventListener("resize", () => { fitCanvas(mapCv); fitCanvas(traceCv); });

function connect() {
  const ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  ws.onopen = () => { $("conn").textContent = "live"; $("conn").className = "ok"; };
  ws.onmessage = ev => { const m = JSON.parse(ev.data); m.type === "snapshot" ? onSnapshot(m) : onBatch(m); };
  ws.onclose = () => { $("conn").textContent = "disconnected, retrying..."; $("conn").className = "bad"; setTimeout(connect, 2000); };
}
fitCanvas(mapCv); fitCanvas(traceCv); connect(); frame();
</script></body></html>
